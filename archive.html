<body>
<header class='site'>
<p class='eyebrow'>Jewel City Church · Gombe</p>
<h1>The Daily Devotional</h1>
<p class='tagline'>A daily portion from the messages preached among us</p>
<nav><a href='index.html'>Today</a><a href='archive.html' class='active'>Archive</a></nav>
</header>
<main>
<h2 class='page-title'>Every edition</h2>
<div id='list'></div>
</main>
<footer class='site-foot'><p>© 2026 Jewel City Church, Gombe</p></footer>
<script src='devotions.js'></script>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function headerHTML(e){return `<p class='date'>${esc(e.display)}</p><h2>${esc(e.title)}</h2>`}
function anchorHTML(e){return `<blockquote class='anchor'><p>${esc(e.anchorText)}</p><cite>${esc(e.anchorRef)}</cite></blockquote>`}
function bodyHTML(e){const ps=e.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('');return anchorHTML(e)+`<div class='body'>${ps}</div><section class='reflection'><h3>Reflection question</h3><p>${esc(e.reflection)}</p></section><section class='prayer'><h3>Closing prayer</h3><p>${esc(e.prayer)}</p></section>`}
document.getElementById('list').innerHTML=DEVOTIONS.map((e,i)=>{if(i===0){return `<article class='card'>${headerHTML(e)}${bodyHTML(e)}</article>`}return `<details class='card closed'><summary><span class='s-date'>${esc(e.display)}</span><span class='s-title'>${esc(e.title)}</span></summary><div class='entry'>${bodyHTML(e)}</div></details>`}).join('');
</script>
</body>
